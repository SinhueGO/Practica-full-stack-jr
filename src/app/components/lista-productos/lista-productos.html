<div style="padding: 20px; font-family: Arial, sans-serif;">
  <h2 style="color: #2c3e50;">📦 Gestión de Inventario</h2>
  
  <table border="1" style="width: 100%; border-collapse: collapse; margin-top: 10px;">
    <thead style="background-color: #f8f9fa;">
      <tr>
        <th style="padding: 10px; text-align: left;">ID</th>
        <th style="padding: 10px; text-align: left;">Nombre</th>
        <th style="padding: 10px; text-align: left;">Precio</th>
        <th style="padding: 10px; text-align: left;">Existencias</th>
      </tr>
    </thead>
    <tbody>
      @for (p of productos; track p.id) {
        <tr>
          <td style="padding: 8px; text-align: center;">{{ p.id }}</td>
          <td style="padding: 8px;">{{ p.nombre }}</td>
          <td style="padding: 8px; text-align: right;">{{ p.precio }}</td>
          <td style="padding: 8px; text-align: center;">{{ p.existencias }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" style="padding: 20px; text-align: center; color: #7f8c8d;">
            No se encontraron productos en el inventario.
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
